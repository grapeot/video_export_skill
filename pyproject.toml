[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-export-skill"
version = "0.1.0"
description = "Independent Resolve export and Apple Compressor transcoding for coding agents"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
video-export = "video_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_export"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
